cv_protocol: 4fold
eval:
  report_per_mouse: true
runs_policy:
  vae:
    runs: 3
    select: best_val_gmm_pred_nmi
  hmm_raw:
    runs: 1
trainer:
  vae_validate_per_epoch: 10
  hmm_raw_validate_per_epoch: 10
hyperparams:
  learning_rate: 0.0003
  epochs: 80
# Bayesian tune winners (bayes50, in-sample all-mice). Source: docs/cv4fold/tune_sweep_bayes50_results.md
tune_winners:
  chmmgmvae:
    trial_id: 5bkceef8
    trainer:
      learning_rate: 0.0014
      epochs: 257
      validate_per_epoch: 5
    dataloader:
      batch_size: 32
      num_batches: 32
    model:
      conditioning_source: subject_lab
      params:
        latent_dim: 4
        emb_dim: 8
        ridge: 0.18
        var_reg: 0.016
        gmm_warmup_epochs: 18
        hmm_warmup_epochs: 37
        hmm_transition_ramp_epochs: 18
        hmm_sticky_kappa: 0.86
        min_beta: 0.016
        beta_schedule: anneal
  cgmvae:
    trial_id: 8duimqhc
    trainer:
      learning_rate: 1.2e-5
      epochs: 240
      validate_per_epoch: 5
    dataloader:
      batch_size: 64
      num_batches: 256
    model:
      conditioning_source: subject_lab
      params:
        latent_dim: 16
        gmm_warmup_epochs: 0
        beta_schedule: anneal
subject_lab_tune_winners:
  scope: joint
  models:
  - cgmvae
  - chmmgmvae
  folds:
  - 1
  - 2
  - 3
  - 4
  results_root: results/cv4fold/subject_lab_tune_winners
  note: >
    4-fold joint CV with tune_winner hyperparams and subject_lab conditioning.
    8 bsub jobs (4 folds x 2 models); runs_policy.vae.runs=3 per job.
