# Subject-wise experiment: HMM on sub-043 with raw data
# Trains and validates on all runs for sub-043
# Runs: [1]

trainer:
  epochs: 5000
  learning_rate: 5.0e-05
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.9999
validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true
  log_likelihood: true
visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true
dataloader:
  num_batches: 350
  batch_size: 128
  validation_batch_size: 1024
  window_size: 512
  stride: 512
  shuffle: true
  normalize: true
  transforms:
  - type: percentile_clipping
    channel: EEG
    params:
      percentile: 0.5
  - type: percentile_clipping
    channel: EMG
    params:
      percentile: 0.1
train_datasets:
- type: mssv
  id: sub-043
  run: 1
  remove_artifact: true
val_datasets:
- type: mssv
  id: sub-043
  run: 1
  remove_artifact: true
model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  n_states: 3
  params: {}
verbose: true
seed: 123
results_dir: results/subjectwise_raw/hmm
run_name: sub043_hmm_mssv_raw
runs: 3
validate_data: true
