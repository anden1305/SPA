trainer:
  epochs: 100
  learning_rate: 0.05
  optimizer: adam
  grad_clip: null
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
dataloader:
  batch_size: null
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "band_power",
        "bands": [[0.5,4],[4,8],[8,12],[12,30],[30,70]],
        "sampling_rate": 128
      }
dataset:
  type: synthetic
  id: test3
model:
  type: hmm
  init_strategy: random_uniform
  init_noisy: True
  params: {}
verbose: true
seed: 123
results_dir: results/training/hmm
run_name: feature_synthetic_uniform
runs: 2
validate_data: True