# Quick test: Generalization HMM - Test on sub-039
# Reduced parameters for fast testing

trainer:
  epochs: 1000  # Quick test
  learning_rate: 0.0005
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 200
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.999

validator:
  nmi: True
  accuracy: True
  cross_nmi: False
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True

visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True

dataloader:
  num_batches: 512  # Reduced for quick test
  batch_size: 32
  validation_batch_size: 256
  window_size: 512
  stride: 512
  shuffle: True
  normalize: True
  transforms:
    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 30,
      }
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }
    - type: rms
      channel: EEG
      params: {}
    - type: theta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_beta_ratio
      channel: EEG
      params: {}
    - type: beta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_gamma_pac
      channel: EEG
      params: {}
    - type: fft_relative_band_power
      channel: EEG
      params:
        bands:
          - [0.5, 4]
          - [6, 9]
          - [15, 30]

    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }
    - type: rms
      channel: EMG
      params: {}

# Train on just 2 mice (reduced for quick test)
train_datasets:
  - type: mssv
    id: sub-041
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-048
    run: 1
    remove_artifact: True

# Validate on sub-039 (held-out mouse)
val_datasets:
  - type: mssv
    id: sub-039
    run: 1
    remove_artifact: True

model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: true
  n_states: 3
  params: {}

verbose: true
seed: 123
results_dir: results/generalization/hmm_test
run_name: test_quick_gen_sub039
runs: 1
validate_data: False  # Skip validation for speed

wandb:
  enabled: false  # Disable for quick local test
