# Base config for substages experiment: HMM on Synthetic Features
# This config will be used by the substages sweep
# The sweep will override model.n_states from 2 to 10

trainer:
  epochs: 100000
  learning_rate: 0.0001  # Best from sweep
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: false   
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.999972

validator:
  nmi: True
  accuracy: True
  cross_nmi: False  # Not needed for substages
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True  # Track model fit quality

visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True

dataloader:
  num_batches: 2048
  batch_size: 32
  validation_batch_size: 256
  window_size: 512
  stride: 512
  shuffle: True
  normalize: True
  transforms:
    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params:
        low_cutoff: 0.5
        high_cutoff: 30
    - type: percentile_clipping
      channel: EEG
      params:
        percentile: 0.5
    - type: rms
      channel: EEG
      params: {}
    - type: theta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_beta_ratio
      channel: EEG
      params: {}
    - type: beta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_gamma_pac
      channel: EEG
      params: {}
    - type: fft_relative_band_power
      channel: EEG
      params:
        bands:
          - [0.5, 4]
          - [6, 9]
          - [15, 30]
    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params:
        percentile: 0.1
    - type: rms
      channel: EMG
      params: {}

train_datasets:
  - type: synthetic
    id: experiments

val_datasets:
  - type: synthetic
    id: experiments

model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform  # Best from sweep
  init_noisy: false
  features: true
  n_states: 3  # Will be overridden by sweep
  params: {}

verbose: true
seed: 123
results_dir: results/substages/hmm
run_name: substages_hmm_synth_features
runs: 1  # Single run per stage count for efficiency
validate_data: True

wandb:
  enabled: true
  group: substages_hmm_synth_features
  tags:
    - substages
    - hmm
    - synthetic
    - features
