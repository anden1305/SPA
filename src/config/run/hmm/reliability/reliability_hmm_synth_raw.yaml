# Reliability experiment: HMM on Synthetic Data RAW (no features)
# Best parameters from sweep: lr=0.0005, init=random_uniform (0.93 NMI, 98% accuracy)
# Purpose: Test how reliably the model finds the same solution across multiple runs using raw EEG/EMG

trainer:
  epochs: 100000
  learning_rate: 0.0005  # Best from sweep
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: false   
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.999972

validator:
  nmi: True
  accuracy: True
  cross_nmi: True  # Critical for reliability analysis
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True  # Track predictive log likelihood on validation set

visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True

dataloader:
  num_batches: 2048
  batch_size: 32
  validation_batch_size: 256
  window_size: 512
  stride: 512
  shuffle: True
  normalize: True
  transforms:
    # EEG channel transforms - minimal preprocessing only
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }
    # EMG channel transforms - minimal preprocessing only
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }

train_datasets:
  - type: synthetic
    id: experiments_raw

val_datasets:
  - type: synthetic
    id: experiments_raw

model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false  # RAW data - no feature engineering
  n_states: 3
  params: {}

verbose: true
seed: 123  # Will auto-increment for each run
results_dir: results/reliability/hmm
run_name: reliability_hmm_synth_raw
runs: 10  # Multiple runs for reliability analysis
validate_data: True
