  covariance_type: full
  init_strategy: random_uniform  # Best from sweep
  init_noisy: false
  features: true
  n_states: 3
  params: {}

verbose: true
seed: 123  # Will auto-increment for each run
results_dir: results/reliability/hmm
run_name: reliability_hmm_mssv_features
runs: 10 # Multiple runs for reliability analysis
validate_data: True
