trainer:
  epochs: 5000
  learning_rate: 0.01
  optimizer: adam
  grad_clip: 5.0
  validate_per_epoch: 100
  early_stopping:
    enabled: true   
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: Null
    gamma: 0.99986 # Half LR after 1000 epochs
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 128
  batch_size: 16384
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: percentile_clipping
      params: {
        "percentile": 5
      }
    - type: high_pass_filter
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 45,
        "sampling_rate": 128
      }
    - type: batch_raw
      params: {
        "window_size": 512
      }
