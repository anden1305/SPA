trainer:
  epochs: 1000
  learning_rate: 0.05
  optimizer: adamw
  grad_clip: null
  validate_per_epoch: 100
  early_stopping: true
  patience: 10
  min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.9975
validator:
  nmi: True
  accuracy: True
  learning_rate: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  batch_size: null
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "band_power",
        "bands": [[0.5,4],[4,8],[8,12],[12,30],[30,100]],
        "sampling_rate": 128
      }
train_datasets:
  - type: synthetic
    id: test4
  - type: synthetic
    id: test4
val_datasets:
  - type: synthetic
    id: test4
  - type: synthetic
    id: test4
model:
  type: hmm
  init_strategy: random_uniform
  init_noisy: false
  params: {}
verbose: true
seed: 123
results_dir: results/training/hmm
run_name: feature_synthetic_separated_test4
runs: 1
validate_data: True