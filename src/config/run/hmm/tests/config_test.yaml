trainer:
  epochs: 250
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: false
    patience: 25
    min_delta: 0.001
  scheduler:
    enabled: true
    type: step
    step_size: 10
    gamma: 0.995
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: False
  summary_statistics: False
  learning_rate: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: False
  summary_statistics: False
  learning_rate: True
  historic_values: True
dataloader:
  batch_size: 51200
  window_size: null
  stride: null
  shuffle: True
  normalize: True
  transforms:

    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 30,
      }
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }

    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }

train_datasets:
  - type: mssv
    id: sub-039
    run: 1
    remove_artifact: True

val_datasets:
  - type: mssv
    id: sub-039
    run: 1
    remove_artifact: True

model:
  type: hmm
  init_strategy: kmeans_pca
  init_noisy: true
  covariance_type: full
  params: {}
verbose: true
seed: 124
results_dir: results/training/hmm
run_name: feature_synthetic_uniform
runs: 1
validate_data: True