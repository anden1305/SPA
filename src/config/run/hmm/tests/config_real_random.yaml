trainer:
  epochs: 50
  learning_rate: 0.0001
  optimizer: adam
validator:
  nmi: True
  cross_nmi: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  pca_top_k: 4
dataloader:
  batch_size: 16384
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: percentile_clipping
      params: {
        "percentile": 5
      }
    - type: high_pass_filter
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 45,
        "sampling_rate": 128
      }
    - type: fft
      params: {
        "window_size": 512,
        "feature": "band_power",
        "sampling_rate": 128,
        bands: [[0.5,4.0], [4.0,8.0], [8.0,12.0], [12.0,30.0], [30.0,45.0]]
      }
dataset:
  type: mssv
  id: sub-038
model:
  type: hmm
  init_strategy: kmeans
verbose: true
seed: 123
results_dir: results/training/hmm
run_name: feature_mssv_random
runs: 1
validate_data: false