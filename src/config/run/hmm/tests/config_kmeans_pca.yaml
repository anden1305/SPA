trainer:
  epochs: 50
  learning_rate: 0.0005
  optimizer: adam
validator:
  nmi: True
  cross_nmi: True
  state_distinctness: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
dataloader:
  batch_size: 16384
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "power",
      }
dataset:
  type: synthetic
  id: adversarial_kmeans_hmm
model:
  type: hmm
  init_strategy: kmeans_pca
verbose: true
seed: 1234
results_dir: results/training/hmm
run_name: feature_synthetic_kmeans_pca_adversarial2
runs: 1