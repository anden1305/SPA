trainer:
  epochs: 3000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: true
    patience: 200
    min_delta: 0.00005
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99993

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 128
  validation_batch_size: 512
  window_size: null
  stride: null
  shuffle: true
  normalize: false
  transforms: []

train_datasets:
  - type: synthetic
    id: spectral_wavelength_comparison8

val_datasets:
  - type: synthetic
    id: spectral_wavelength_comparison8

model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params: {}

verbose: true
seed: 42
results_dir: results/training/wavelength_comparison8
run_name: hmm_wavelength_comparison8_kmeans
runs: 1
validate_data: false

wandb:
  enabled: true
  project: SPA
  entity: null
  group: wavelength_comparison8
  tags: [hmm, spectral, wavelength, baseline, kmeans]
