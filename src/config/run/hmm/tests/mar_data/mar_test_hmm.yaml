trainer:
  epochs: 3000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 200
  early_stopping:
    enabled: true
    patience: 25
    min_delta: 0.001
  scheduler:
    enabled: false
    type: step
    step_size: 100
    gamma: 0.9
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 1000000          # Single full pass per epoch
  batch_size: 170          # Windows per epoch (if windowing applied)
  validation_batch_size: 1024
  window_size: null       # Raw sequence (batch_raw transform handles windowing)
  stride: null            # No sliding windows at DataLoader level
  shuffle: True
  normalize: True
  transforms: []
train_datasets:
  - type: synthetic
    id: mar_test
val_datasets:
  - type: synthetic
    id: mar_test
model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params: {}
verbose: True
seed: 42
results_dir: results/training/hmm
run_name: mar_data_raw_hmm
runs: 1
validate_data: True
