trainer:
  epochs: 5000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 0.0005
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99993

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 1024  # Match MARHMM for fair comparison
  validation_batch_size: 2048
  window_size: null
  stride: null
  shuffle: true
  normalize: true   # Ensure identical marginals (mean=0, std=1)
  transforms: []    # No preprocessing

train_datasets:
  - type: synthetic
    id: pure_3class

val_datasets:
  - type: synthetic
    id: pure_3class
model:
  type: hmm
  covariance_type: full
  init_strategy: kmeans  # Use kmeans (not kmeans_pca) for 1D data
  init_noisy: false
  features: false
  params: {}

verbose: true
seed: 42
results_dir: results/training/hmm
run_name: experiment_pure_3class_hmm
runs: 1
validate_data: false

wandb:
  enabled: true
  project: SPA
  entity: null
  group: stable_oscillatory_mar_experiments
  tags: [hmm, mar_data, synthetic, raw, oscillatory]
