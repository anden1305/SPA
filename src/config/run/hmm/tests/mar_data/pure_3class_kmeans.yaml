trainer:
  epochs: 3000
  learning_rate: 0.005
  optimizer: adam
  grad_clip: 1.0
  validate_per_epoch: 50
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.999

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 512  # CRITICAL: 1 epoch = 4s × 128Hz = 512 samples
  validation_batch_size: 512
  window_size: null
  stride: null
  shuffle: true
  normalize: false  # Data already per-epoch normalized during generation!
  transforms: []

train_datasets:
  - type: synthetic
    id: pure_3class

val_datasets:
  - type: synthetic
    id: pure_3class

model:
  type: hmm
  covariance_type: full
  init_strategy: kmeans  # Fair initialization using temporal clustering
  init_noisy: false
  features: false
  params: {}

verbose: true
seed: 42
results_dir: results/training/hmm
run_name: pure_3class_hmm_kmeans
runs: 1
validate_data: false

wandb:
  enabled: true
  project: SPA
  entity: null
  group: pure_3class_proof_of_concept
  tags: [hmm, mar_data, synthetic, kmeans_init, baseline]
