# Train HMM on separable MAR dataset
# Should perform poorly (~50-60%) as it ignores temporal structure

verbose: true
seed: 42
runs: 1
validate_data: false
run_name: hmm_separable_3states
results_dir: results/training/hmm

wandb:
  enabled: false
  project: SPA
  entity: null
  group: separable_ar_experiments
  tags: [hmm, mar_data, separable]

trainer:
  epochs: 5000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 0.0005
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99993

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 350
  validation_batch_size: 1024
  window_size: null
  stride: null
  shuffle: true
  normalize: false
  transforms: []

train_datasets:
  - type: synthetic
    id: mar_separable_3states

val_datasets:
  - type: synthetic
    id: mar_separable_3states

model:
  type: hmm
  covariance_type: full
  init_strategy: kmeans
  init_noisy: false
  features: false
  params: {}

