trainer:
  epochs: 2500
  learning_rate: 0.01
  optimizer: adam
  grad_clip: null
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  param_histories: True
dataloader:
  batch_size: null
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "band_power",
        "bands": [[0.5,2], [2,4],[4,6], [6,8], [8,10],[10,12],[12,20], [20,30],[30,70]],
        "sampling_rate": 128
      }
dataset:
  type: mssv
  id: sub-077
model:
  type: hmm
  init_strategy: random_uniform
  init_noisy: True
  params: {}
verbose: true
seed: 123
results_dir: results/training/hmm
run_name: kmeans_feature_synthetic
runs: 10
validate_data: True