# Subject-wise experiment: HMM on sub-060 with features
# Trains and validates on all runs for sub-060
# Runs: [1]

trainer:
  epochs: 100000
  learning_rate: 5.0e-05
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.999972
validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true
  log_likelihood: true
visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true
dataloader:
  num_batches: 8192
  batch_size: 32
  validation_batch_size: 256
  window_size: 512
  stride: 512
  shuffle: true
  normalize: true
  transforms:
  - type: band_pass_filter
    channel: EEG
    params:
      low_cutoff: 0.5
      high_cutoff: 30
  - type: percentile_clipping
    channel: EEG
    params:
      percentile: 0.5
  - type: rms
    channel: EEG
    params: {}
  - type: theta_delta_ratio
    channel: EEG
    params: {}
  - type: theta_beta_ratio
    channel: EEG
    params: {}
  - type: beta_delta_ratio
    channel: EEG
    params: {}
  - type: theta_gamma_pac
    channel: EEG
    params: {}
  - type: fft_relative_band_power
    channel: EEG
    params:
      bands:
      - - 0.5
        - 4
      - - 6
        - 9
      - - 15
        - 30
  - type: percentile_clipping
    channel: EMG
    params:
      percentile: 0.1
  - type: rms
    channel: EMG
    params: {}
train_datasets:
- type: mssv
  id: sub-060
  run: 1
  remove_artifact: true
val_datasets:
- type: mssv
  id: sub-060
  run: 1
  remove_artifact: true
model:
  type: hmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: true
  n_states: 3
  params: {}
verbose: true
seed: 123
results_dir: results/subjectwise/hmm
run_name: sub060_hmm_mssv_features
runs: 3
validate_data: true
