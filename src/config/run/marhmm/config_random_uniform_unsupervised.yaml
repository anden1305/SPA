trainer:
  epochs: 2000
  learning_rate: 0.01
  optimizer: adam
  grad_clip: 5.0
  validate_per_epoch: 0   
  early_stopping:
    enabled: true    
    patience: 40
    min_delta: 0.1
validator:
  nmi: False
  accuracy: False
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  batch_size: null
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "band_power",
        "bands": [[0.5,4],[4,8],[8,12],[12,30],[30,70]],
        "sampling_rate": 128
      }
dataset:
  type: synthetic
  id: test3
model:
  type: marhmm
  init_strategy: random_uniform
  init_noisy: True
  params:
    lags: [1, 2, 4, 8]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
verbose: True
seed: 42
results_dir: results/training/marhmm
run_name: feature_synthetic_uniform_unsupervised
runs: 3
validate_data: True
