model:
  type: marhmm
  covariance_type: full
  init_strategy: kmeans_pca
  init_noisy: True
  params:
    lags: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
verbose: True
seed: 123
results_dir: results/training/marhmm
run_name: experiment_mssv_features
runs: 5
validate_data: True
