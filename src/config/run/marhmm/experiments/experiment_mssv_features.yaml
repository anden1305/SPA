trainer:
  epochs: 5000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: 5.0
  validate_per_epoch: 10
  early_stopping:
    enabled: true
    patience: 25
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: Null
    gamma: 0.99931 # Half LR after 1000 epochs
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  batch_size: null
  window_size: 512
  stride: 171
  shuffle: True
  normalize: True
  transforms:
    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 30,
      }
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }
    - type: rms
      channel: EEG
      params: {}
    - type: burst_rate
      channel: EEG
      params: {}
    - type: theta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_beta_ratio
      channel: EEG
      params: {}
    - type: beta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_gamma_pac
      channel: EEG
      params: {}
    - type: fft_relative_band_power
      channel: EEG
      params:
        bands:
          - [0.5, 4]
          - [6, 9]
          - [15, 30]

    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }
    - type: rms
      channel: EMG
      params: {}

