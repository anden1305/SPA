trainer:
  epochs: 30000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: Null
    gamma: 0.99993
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 3200000
  batch_size: 120
  validation_batch_size: 4096
  window_size: null
  stride: null
  shuffle: True
  normalize: True
  transforms:
    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 30,
      }
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }
    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }
