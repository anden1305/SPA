trainer:
  epochs: 200
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
dataloader:
  batch_size: 16384
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "power",
      }
dataset:
  type: synthetic
  id: test3
model:
  type: marhmm
  init_strategy: random_uniform
  init_noisy: false
  params:
    lags: [1, 2, 4]  # Fewer lags to reduce computation
    normalize_time: false
    ridge: 0.01  # Reduced ridge regularization
    var_reg: 0.001  # Add variance regularization
    ignore_prefix: true
    drop_prefix_from_normalization: true
verbose: True
seed: 42
results_dir: results/training/marhmm
run_name: feature_synthetic_uniform
runs: 1
validate_data: True
