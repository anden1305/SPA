trainer:
  epochs: 100000
  learning_rate: 0.00005
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: false
    patience: 250
    min_delta: 0.0001
  scheduler:
    enabled: true
    type: exponential
    step_size: 10
    gamma: 0.999972
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
  learning_rate: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  learning_rate: True
  historic_values: True
dataloader:
  num_batches: 100
  batch_size: 100
  window_size: 512
  stride: 512
  shuffle: True
  normalize: True
  transforms:

    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 30,
      }
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }
    - type: rms
      channel: EEG
      params: {}
    - type: theta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_beta_ratio
      channel: EEG
      params: {}
    - type: beta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_gamma_pac
      channel: EEG
      params: {}
    - type: fft_relative_band_power
      channel: EEG
      params:
        bands:
          - [0.5, 4]
          - [6, 9]
          - [15, 30]

    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }
    - type: rms
      channel: EMG
      params: {}

train_datasets:
  - type: mssv
    id: sub-041
    run: 1
    remove_artifact: True

val_datasets:
  - type: mssv
    id: sub-041
    run: 1
    remove_artifact: True

model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: True
  params:
    lags: [1, 2, 4, 8]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
verbose: true
seed: 123
results_dir: results/training/hmm
run_name: feature_synthetic_uniform
runs: 1
validate_data: True