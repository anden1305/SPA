trainer:
  epochs: 50
  learning_rate: 0.0001
  optimizer: adam
  grad_clip: null
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
dataloader:
  batch_size: 4096
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: percentile_clipping
      params: {
        "percentile": 5
      }
    - type: high_pass_filter
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 45,
        "sampling_rate": 128
      }
    - type: batch_raw
      params: {
        "window_size": 512
      }
dataset:
  type: synthetic
  id: test3
model:
  type: marhmm
  init_strategy: random_uniform
  init_noisy: false
  params:
    lags: [1, 2, 4]
    ridge: 0.001
    var_reg: 0.001  # Add variance regularization
verbose: true
seed: 123
results_dir: results/training/marhmm
run_name: raw_synthetic_uniform
runs: 1
validate_data: False