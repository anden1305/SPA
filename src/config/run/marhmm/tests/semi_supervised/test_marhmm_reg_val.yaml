# Reliability experiment: MAR-HMM on MSSV Data with Features
# Best parameters from sweep: lr=0.0001, init=random_uniform
# Purpose: Test how reliably the model finds the same solution across multiple runs

trainer:
  epochs: 5000
  learning_rate: 0.0005
  optimizer: adam
  grad_clip: 0.5
  validate_per_epoch: 10
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.999972

validator:
  nmi: True
  accuracy: True
  cross_nmi: True  # Critical for reliability analysis
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True  # Track predictive log likelihood on validation set

visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True

dataloader:
  num_batches: 64
  batch_size: 512
  validation_batch_size: 512
  window_size: 512
  stride: 512
  shuffle: True
  normalize: True
  transforms:
    # EEG channel transforms
    - type: band_pass_filter
      channel: EEG
      params: {
        "low_cutoff": 0.5,
        "high_cutoff": 30,
      }
    - type: percentile_clipping
      channel: EEG
      params: {
        "percentile": 0.5
      }
    - type: rms
      channel: EEG
      params: {}
    - type: theta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_beta_ratio
      channel: EEG
      params: {}
    - type: beta_delta_ratio
      channel: EEG
      params: {}
    - type: theta_gamma_pac
      channel: EEG
      params: {}
    - type: fft_relative_band_power
      channel: EEG
      params:
        bands:
          - [0.5, 4]
          - [6, 9]
          - [15, 30]

    # EMG channel transforms
    - type: percentile_clipping
      channel: EMG
      params: {
        "percentile": 0.1
      }
    - type: rms
      channel: EMG
      params: {}

train_datasets:
  - type: mssv
    id: sub-038
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-038
    run: 2
    remove_artifact: True
  - type: mssv
    id: sub-039
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-039
    run: 2
    remove_artifact: True
  - type: mssv
    id: sub-039
    run: 3
    remove_artifact: True
  - type: mssv
    id: sub-041
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-041
    run: 2
    remove_artifact: True
  - type: mssv
    id: sub-041
    run: 3
    remove_artifact: True
  - type: mssv
    id: sub-043
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-048
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-048
    run: 2
    remove_artifact: True
  - type: mssv
    id: sub-048
    run: 3
    remove_artifact: True
  - type: mssv
    id: sub-054
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-054
    run: 2
    remove_artifact: True
  - type: mssv
    id: sub-056
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-059
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-060
    run: 1
    remove_artifact: True

val_datasets:
  - type: mssv
    id: sub-058
    run: 1
    remove_artifact: True
  - type: mssv
    id: sub-058
    run: 2
    remove_artifact: True

model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform  # Best from sweep
  init_noisy: false
  features: true
  n_states: 3
  params:
    lags: [1, 2, 3]
    ridge: 2.0
    var_reg: 1.0
    sticky_coef: 1e-2
    sticky_kappa: 0.8

verbose: true
seed: 42  # Will auto-increment for each run
results_dir: results/testing/marhmm
run_name: testing_marhmm_regularisation_val
runs: 1  # Multiple runs for reliability analysis
validate_data: True
