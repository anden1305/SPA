trainer:
  epochs: 20000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 0.0005
  scheduler:
    enabled: false
    type: exponential
    step_size: Null
    gamma: 0.99993
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 1000000
  batch_size: 1024
  validation_batch_size: 1024
  window_size: null
  stride: null
  shuffle: True
  normalize: False
  transforms: []
train_datasets:
  - type: synthetic
    id: mar_proof
val_datasets:
  - type: synthetic
    id: mar_proof
model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params:
    lags: [1, 2, 8, 32]
    ridge: 0.05
    var_reg: 0.02
    sticky_coef: 0.10
    sticky_kappa: 0.85
verbose: True
seed: 42
results_dir: results/training/marhmm
run_name: experiment_synth_raw_mar_marhmm
runs: 1
validate_data: False
wandb:
  enabled: true
  project: SPA
  entity: null
  group: mar_proof_experiments
  tags: [marhmm, mar_data, synthetic, raw]
