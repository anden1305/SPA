trainer:
  epochs: 3000
  learning_rate: 0.005
  optimizer: adam
  grad_clip: 1.0
  validate_per_epoch: 50
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.999

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 512  # CRITICAL: 1 epoch = 4s × 128Hz = 512 samples
  validation_batch_size: 512
  window_size: null
  stride: null
  shuffle: true
  normalize: false  # Data already per-epoch normalized during generation!
  transforms: []

train_datasets:
  - type: synthetic
    id: pure_3class

val_datasets:
  - type: synthetic
    id: pure_3class

model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform  # Poor initialization to show MARHMM needs good init
  init_noisy: false
  features: false
  params:
    lags: [1, 2]  # Match data generation lags
    ridge: 0.001  # Minimal regularization
    var_reg: 0.001
    sticky_coef: 0.0
    sticky_kappa: 0.0

verbose: true
seed: 42
results_dir: results/training/marhmm
run_name: pure_3class_marhmm_random
runs: 1
validate_data: false

wandb:
  enabled: true
  project: SPA
  entity: null
  group: pure_3class_proof_of_concept
  tags: [marhmm, mar_data, synthetic, random_init, negative_control]
