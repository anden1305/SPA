trainer:
  epochs: 5000
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 0.0005
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99993

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 350
  validation_batch_size: 1024
  window_size: null
  stride: null
  shuffle: true
  normalize: false  # CRITICAL: Keep raw MAR data
  transforms: []    # No preprocessing

train_datasets:
  - type: synthetic
    id: stable_oscillatory_mar

val_datasets:
  - type: synthetic
    id: stable_oscillatory_mar

model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params:
    lags: [1, 2]  # MUST MATCH generation lags
    ridge: 0.05   # L2 penalty on AR coefficients
    var_reg: 0.02 # Variance stabilization
    sticky_coef: 0.10
    sticky_kappa: 0.85

verbose: true
seed: 42
results_dir: results/training/marhmm
run_name: experiment_stable_oscillatory_mar_marhmm
runs: 1
validate_data: false

wandb:
  enabled: true
  project: SPA
  entity: null
  group: stable_oscillatory_mar_experiments
  tags: [marhmm, mar_data, synthetic, raw, oscillatory]
