trainer:
  epochs: 7500
  learning_rate: 0.001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 500
  early_stopping:
    enabled: false
    patience: 25
    min_delta: 0.001
  scheduler:
    enabled: false
    type: step
    step_size: 100
    gamma: 0.9
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 1000000
  batch_size: 170
  validation_batch_size: 1024
  window_size: null
  stride: null
  shuffle: True
  normalize: False
  transforms: []
train_datasets:
  - type: synthetic
    id: mar_temporal_only
val_datasets:
  - type: synthetic
    id: mar_temporal_only
model:
  type: marhmm
  covariance_type: full
  init_strategy: random_separated
  init_noisy: false
  features: false
  params:
    lags: [1, 2, 4, 8, 16, 32, 64]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
verbose: True
seed: 42
results_dir: results/training/marhmm
run_name: mar_temporal_only_marhmm
runs: 1
validate_data: True
