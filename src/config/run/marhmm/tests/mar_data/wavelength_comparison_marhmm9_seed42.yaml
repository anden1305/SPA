trainer:
  epochs: 5000
  learning_rate: 0.0005  # Slightly slower for stability
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: true
    patience: 300  # Very patient - don't stop prematurely
    min_delta: 0.00005
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99993

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 256  # Larger batches for more stable gradients
  validation_batch_size: 512
  window_size: null
  stride: null
  shuffle: true
  normalize: false
  transforms: []

train_datasets:
  - type: synthetic
    id: spectral_wavelength_comparison9

val_datasets:
  - type: synthetic
    id: spectral_wavelength_comparison9

model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform  # Random worked for 2-class
  init_noisy: false
  features: false
  params:
    lags: [4, 8]  # Perfect alignment: lag 4 for wavelength 4, lag 8 for wavelength 8
    ridge: 0.005  # Middle of proven 0.001-0.01 range
    var_reg: 0.005
    sticky_coef: 0.25
    sticky_kappa: 0.93

verbose: true
seed: 42
results_dir: results/training/wavelength_comparison9
run_name: marhmm_wavelength_comparison9_lags_4_8_seed42
runs: 1
validate_data: false

wandb:
  enabled: true
  project: SPA
  entity: null
  group: wavelength_comparison9
  tags: [marhmm, spectral, wavelength, lags_4_8, power_of_2, optimal, seed42]
