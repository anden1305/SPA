# Subject-wise experiment: MARHMM on sub-038 with raw data
# Trains and validates on all runs for sub-038
# Runs: [1, 2]

trainer:
  epochs: 5000
  learning_rate: 5.0e-05
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: true
    type: exponential
    step_size: null
    gamma: 0.9999
validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true
  log_likelihood: true
visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true
dataloader:
  num_batches: 700
  batch_size: 128
  validation_batch_size: 1024
  window_size: 512
  stride: 512
  shuffle: true
  normalize: true
  transforms:
  - type: percentile_clipping
    channel: EEG
    params:
      percentile: 0.5
  - type: percentile_clipping
    channel: EMG
    params:
      percentile: 0.1
train_datasets:
- type: mssv
  id: sub-038
  run: 1
  remove_artifact: true
- type: mssv
  id: sub-038
  run: 2
  remove_artifact: true
val_datasets:
- type: mssv
  id: sub-038
  run: 1
  remove_artifact: true
- type: mssv
  id: sub-038
  run: 2
  remove_artifact: true
model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  n_states: 3
  params:
    lags:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
verbose: true
seed: 123
results_dir: results/subjectwise_raw/marhmm
run_name: sub038_marhmm_mssv_raw
runs: 3
validate_data: true
