trainer:
  epochs: 2500
  learning_rate: 0.0001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 100
  early_stopping:
    enabled: false
    patience: 300
    min_delta: 0.00005
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99993

validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true

visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true

dataloader:
  num_batches: 1000000
  batch_size: 512  # Back to smaller batch size
  validation_batch_size: 512
  window_size: null
  stride: null
  shuffle: true
  normalize: false
  transforms: []

train_datasets:
  - type: synthetic
    id: spectral_wavelength_comparison_new

val_datasets:
  - type: synthetic
    id: spectral_wavelength_comparison_new

model:
  type: marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params:
    lags: [1, 2, 4, 8, 16, 32, 64] 
    ridge: 0.0
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9

verbose: true
seed: 123
results_dir: results/training/wavelength_comparison_new
run_name: marhmm_wavelength_comparison_new
runs: 3
validate_data: true

wandb:
  enabled: true
  project: SPA
  entity: null
  group: wavelength_comparison_new
  tags: [marhmm, spectral, wavelength]
