trainer:
  epochs: 2500
  learning_rate: 0.00005
  optimizer: adam
  grad_clip: 0.5
  validate_per_epoch: 10
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: Null
    gamma: 0.99
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 64 # EXPERIMENTAL
  batch_size: 512 # EXPERIMENTAL
  validation_batch_size: 512 # EXPERIMENTAL
  window_size: 512
  stride: 512
  sequence_length: 512 # EXPERIMENTAL
  shuffle: True
  normalize: True
  use_legacy: False
  transforms: []

