model:
  type: cvae_marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params:

    # MARHMM
    lags: [1, 2, 4]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9

    # CVAE
    # dimensions
    latent_dim: 8
    hidden_dims: [64, 32]
    # subject emdedding
    subject_conditioning: true
    emb_dim: 8
    # prior
    prior: gmm
    min_beta: 0.1
    max_beta: 0.5
    beta_warmup: 50
    use_conv: true
    sequence_length: 512
verbose: True
seed: 123
results_dir: results/training/cvaemarhmm
run_name: cvae_pretraining_test
runs: 1
validate_data: True