model:
  type: cvae_marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: false
  features: false
  params:
    lags: [1, 2, 4]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
    latent_dim: 8
    hidden_dims: [32, 16]
    emb_dim: 4
verbose: True
seed: 123
results_dir: results/training/cvaemarhmm
run_name: cvae_pretraining_test
runs: 1
validate_data: True
