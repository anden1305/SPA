trainer:
  epochs: 35000
  learning_rate: 0.000001
  optimizer: adam
  grad_clip: null
  validate_per_epoch: 1000
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: Null
    gamma: 0.9993078707
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 3200000
  batch_size: 32
  validation_batch_size: 128
  window_size: 512
  stride: 512
  shuffle: True
  normalize: True
  use_legacy: False
  transforms:
    # EEG channel transforms
    - type: fft_log_power
      channel: EEG
      params: {}

    # EMG channel transforms
    - type: fft_log_power
      channel: EMG
      params: {}

