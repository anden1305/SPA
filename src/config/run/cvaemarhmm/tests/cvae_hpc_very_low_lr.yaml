model:
  type: cvae_marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: true
  features: false
  params:
    
    # MARHMM parameters
    lags: [1, 2, 4]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
    
    # CVAE parameters
    # weights
    # latent_dim: 16
    # enc_hidden_dims: [256, 128]
    # dec_hidden_dims: [64]
    # conv_channels: [32, 64]
    # kernel_sizes:  [5, 3]
    # strides:       [2, 2]
    # paddings:      [2, 1]
    # emb_dim: 4
    latent_dim: 12
    enc_hidden_dims: [256]
    dec_hidden_dims: [256]
    conv_channels: [32, 64, 128, 128]
    kernel_sizes:  [7, 5, 5, 3]
    strides:       [2, 2, 2, 2]
    paddings:      [3, 2, 2, 1]
    emb_dim: 8
    use_rms: False
    # prior
    prior: warm_gmm
    min_beta: 0.0001
    max_beta: 0.1
    beta_warmup_epochs: 50
    beta_slowdown_epochs: 0
    gmm_warmup_epochs: 500
    no_beta_epochs: 50

verbose: True
seed: 123
results_dir: results/training/cvaemarhmm
run_name: cvae_very_low_lr_12_dim
runs: 1
validate_data: True
