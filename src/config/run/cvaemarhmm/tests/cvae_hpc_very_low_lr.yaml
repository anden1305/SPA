trainer:
  epochs: 4000
  learning_rate: 0.000005
  optimizer: adam
  grad_clip: 0.5
  validate_per_epoch: 10000
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: Null
    gamma: 0.99
