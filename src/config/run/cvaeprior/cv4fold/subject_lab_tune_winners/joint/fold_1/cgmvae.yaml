trainer:
  epochs: 240
  learning_rate: 1.2e-05
  optimizer: adam
  grad_clip: 0.5
  validate_per_epoch: 5
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: null
    gamma: 0.99
validator:
  nmi: true
  accuracy: true
  cross_nmi: true
  learning_rate: true
  state_distinctness: true
  summary_statistics: true
  log_likelihood: true
visualizer:
  losses: true
  learning_rate: true
  pca_tripanel: true
  confusion_matrix: true
  state_distinctness: true
  summary_statistics: true
  historic_values: true
dataloader:
  num_batches: 256
  batch_size: 64
  validation_batch_size: 64
  window_size: 512
  stride: 512
  sequence_length: 64
  shuffle: true
  normalize: true
  use_legacy: false
  transforms: []
model:
  type: cvae_marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: true
  features: false
  conditioning_source: subject_lab
  params:
    lags:
    - 1
    - 2
    - 4
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
    latent_dim: 16
    enc_hidden_dims:
    - 256
    - 128
    dec_hidden_dims:
    - 128
    - 256
    conv_channels:
    - 32
    - 64
    - 128
    - 128
    kernel_sizes:
    - 7
    - 5
    - 5
    - 3
    strides:
    - 2
    - 2
    - 2
    - 2
    paddings:
    - 3
    - 2
    - 2
    - 1
    emb_dim: 4
    decoder_only_conditioning: true
    use_rms: false
    prior: gmm
    num_gmm_states: 3
    min_beta: 0.01
    max_beta: 1.0
    beta_schedule: anneal
    beta_cyclical_period_epochs: 40
    beta_warmup_epochs: 0
    beta_slowdown_epochs: 0
    gmm_warmup_epochs: 0
    free_nats_per_dim: 0.0
    no_beta_epochs: 10
cvae:
  normalize_global: false
  pre_normalize: false
  post_normalize: true
  percentile_clip_channels: false
  perform_hanning_window: false
  band_pass_filter_fft: true
  band_pass_freqs:
  - - null
    - 20.0
  - - null
    - 20.0
  - - 5.0
    - 60.0
  band_pass_filter_type: frequency_domain
  training_pipeline: cvae
  model_checkpoint_path: null
  reinit_marhmm: false
verbose: true
seed: 123
runs: 3
validate_data: true
