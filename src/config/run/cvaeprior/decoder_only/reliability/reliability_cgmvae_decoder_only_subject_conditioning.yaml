model:
  type: cvae_marhmm
  covariance_type: full
  init_strategy: random_uniform # EXPERIMENTAL
  init_noisy: true
  features: false
  params:
    
    # MARHMM parameters
    lags: [1, 2, 4]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9
    
    # CVAE parameters
    # weights
    latent_dim: 8 # FIXED
    enc_hidden_dims: [256, 128] # FIXED
    dec_hidden_dims: [128, 256] # FIXED
    conv_channels: [32, 64, 128, 128] # FIXED
    kernel_sizes:  [7, 5, 5, 3] # FIXED
    strides:       [2, 2, 2, 2] # FIXED
    paddings:      [3, 2, 2, 1] # FIXED
    emb_dim: 4 # FIXED
    decoder_only_conditioning: true # FIXED
    use_rms: False # FIXED
    # prior
    prior: gmm # FIXED
    min_beta: 0.01 # FIXED
    max_beta: 1.0 # FIXED
    beta_warmup_epochs: 0 # FIXED
    beta_slowdown_epochs: 0 # FIXED
    gmm_warmup_epochs: 0 # FIXED
    free_nats_per_dim: 0.00 # FIXED
    no_beta_epochs: 10 # FIXED

cvae:
  normalize_global: False # FIXED
  pre_normalize: False # FIXED
  post_normalize: True # FIXED
  percentile_clip_channels: False # FIXED
  perform_hanning_window: False # FIXED
  band_pass_filter_fft: True # FIXED
  band_pass_freqs: [[null, 20.0], [null, 20.0], [5.0, 60.0]] # FIXED
  band_pass_filter_type: frequency_domain # FIXED
  training_pipeline: cvae
  model_checkpoint_path: results/decoder_only/cvae_final_decoder_only/cvae_decoder_only_model.pth
  reinit_marhmm: false

verbose: True
seed: 123
results_dir: results/decoder_only/reliability/cgmvae_decoder_only
run_name: reliability_cgmvae_decoder_only_mssv_frequency
runs: 10
validate_data: True
