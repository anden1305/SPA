# Thesis-style reliability: lab_3 mice only, subject + decoder-only conditioning.
# Matches reliability_cgmvae_decoder_only_subject_conditioning.yaml (seq1, batch 128,
# train=val cohort, 10 runs) but uses warm_hmm_gmm prior and chmm tune-winner model
# hyperparams (5bkceef8) with subject conditioning (not subject_lab).
#
# Compare Pred. NMI to table row "cGMVAE Prior Decoder" (~0.725 subject scope).
# After train_vae: HMM Viterbi validation via predict_cvae (automatic).

trainer:
  epochs: 80
  learning_rate: 0.0014
  optimizer: adam
  grad_clip: 0.5
  validate_per_epoch: 1
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: Null
    gamma: 0.99

validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True

visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True

dataloader:
  num_batches: 64
  batch_size: 128
  validation_batch_size: 128
  window_size: 512
  stride: 512
  sequence_length: 1
  shuffle: True
  normalize: True
  use_legacy: False
  transforms: []

