# Lab 3 reliability: cHMM-GMM VAE (successful POC settings, 120 epochs).
# Compare to decoder_only/reliability/reliability_cgmvae_decoder_only_subject_conditioning.yaml
# (same subjects/runs, subject conditioning, 10 seeds; that baseline uses seq_len=1 + prior: gmm).

trainer:
  epochs: 120
  learning_rate: 0.0003
  optimizer: adam
  grad_clip: 0.5
  validate_per_epoch: 1
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.001
  scheduler:
    enabled: false
    type: exponential
    step_size: Null
    gamma: 0.99
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  learning_rate: True
  state_distinctness: True
  summary_statistics: True
  log_likelihood: True
visualizer:
  losses: True
  learning_rate: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
  historic_values: True
dataloader:
  num_batches: 64
  batch_size: 64
  validation_batch_size: 64
  window_size: 512
  stride: 512
  sequence_length: 64
  shuffle: True
  normalize: True
  use_legacy: False
  transforms: []

