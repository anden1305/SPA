model:
  type: cvae_marhmm
  covariance_type: full
  init_strategy: random_uniform
  init_noisy: true
  features: false
  conditioning_source: subject
  params:
    lags: [1, 2, 4]
    ridge: 0.1
    var_reg: 0.05
    sticky_coef: 0.1
    sticky_kappa: 0.9

    latent_dim: 8
    enc_hidden_dims: [256, 128]
    dec_hidden_dims: [128, 256]
    conv_channels: [32, 64, 128, 128]
    kernel_sizes:  [7, 5, 5, 3]
    strides:       [2, 2, 2, 2]
    paddings:      [3, 2, 2, 1]
    emb_dim: 4
    decoder_only_conditioning: true
    use_rms: False

    # From sub039_chmmgmvae_poc_20260518-110816 (successful POC)
    prior: warm_hmm_gmm
    num_gmm_states: 3
    gmm_warmup_epochs: 10
    hmm_warmup_epochs: 25
    hmm_transition_ramp_epochs: 8
    hmm_sticky_kappa: 0.9
    hmm_estimate_transitions: true

    min_beta: 0.01
    max_beta: 1.0
    beta_warmup_epochs: 0
    beta_slowdown_epochs: 0
    free_nats_per_dim: 0.00
    no_beta_epochs: 10

cvae:
  normalize_global: False
  pre_normalize: False
  post_normalize: True
  percentile_clip_channels: False
  perform_hanning_window: False
  band_pass_filter_fft: True
  band_pass_freqs: [[null, 20.0], [null, 20.0], [5.0, 60.0]]
  band_pass_filter_type: frequency_domain
  training_pipeline: cvae
  model_checkpoint_path: results/decoder_only/cvae_final_decoder_only/cvae_decoder_only_model.pth
  reinit_marhmm: false

verbose: True
seed: 123
results_dir: results/hmmgmm/reliability/lab3
run_name: lab3_chmmgmvae_decoder_only_subject_conditioning
runs: 10
validate_data: True
