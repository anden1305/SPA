trainer:
  epochs: 10
  learning_rate: 0.0005
validator:
  nmi: True
  cross_nmi: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  pca_top_k: 4
dataloader:
  batch_size: 5120
  shuffle: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
      }
dataset:
  type: synthetic
  id: test3
model:
  type: hmm
  init_strategy: kmeans
verbose: true
seed: 123
results_dir: results/training
run_name: test
runs: 2