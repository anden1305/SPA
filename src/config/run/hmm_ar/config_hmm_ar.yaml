trainer:
  epochs: 50  
  learning_rate: 0.001
  optimizer: adam
  grad_clip: 1.0
validator:
  nmi: True
  accuracy: True
  cross_nmi: True
  state_distinctness: False
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: False
  summary_statistics: True
dataloader:
  batch_size: 512
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
dataset:
  type: synthetic
  id: test3
  normalize: True
model:
  type: hmm_ar
  init_strategy: random_uniform
  init_noisy: False
  # HMMAR-specific parameters
  lags: [1, 2, 4, 8]  # AR lags - exponential spacing
  normalize_time: False  # Whether to normalize log-likelihood by time steps
  ridge: 0.001  # Ridge regularization for AR coefficients
  ignore_prefix: True  # Ignore first max_lag frames in emission calculation
  drop_prefix_from_normalization: True  # Drop prefix frames from time normalization
verbose: True
seed: 42
results_dir: results/training
run_name: hmm_ar_default
runs: 1
validate_data: False
