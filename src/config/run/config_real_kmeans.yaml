trainer:
  epochs: 50
  learning_rate: 0.001
  optimizer: adam
validator:
  nmi: True
  cross_nmi: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  pca_top_k: 4
dataloader:
  batch_size: 16384
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "band_power",
      }
dataset:
  type: mssv
  id: sub-050
model:
  type: hmm
  init_strategy: kmeans
verbose: true
seed: 123
results_dir: results/training
run_name: feature_mssv_kmeans
runs: 1