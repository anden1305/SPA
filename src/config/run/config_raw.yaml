trainer:
  epochs: 10
  learning_rate: 0.01
  optimizer: adam
validator:
  nmi: True
  cross_nmi: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  pca_top_k: 4
dataloader:
  batch_size: 4096
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: batch_raw
      params: {
        "window_size": 512
      }
dataset:
  type: synthetic
  id: test3
model:
  type: hmm
  init_strategy: random
verbose: true
seed: 123
results_dir: results/training
run_name: raw_synthetic
runs: 1