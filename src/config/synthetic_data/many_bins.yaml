## Realistic synthetic sleep config derived from real data exploration (excluding Artifact stage)
## Source stats (approx):
##   Stage proportions (mean): Awake ~45%, NREM ~49%, REM ~6%
##   Transition high self-persistence (>99.99% per 30s epoch) so we reduce slightly for variability.
##   Non-self transitions (normalized) suggest: Awake->NREM dominant, NREM->Awake dominant,
##     REM often goes to Awake, smaller fractions to NREM.
##
## Generator stages order: 0=Awake, 1=NREM, 2=REM
name: many_bins
sampling_rate_hz: 128          # Close to dataset median (assumed 128 Hz)
epoch_length_s: 4              # Standard PSG scoring epoch length
n_epochs: 1000                   # ~3h20m of data (400*30s)
n_stages: 3

# Transition matrix (row i -> next state j). Rows sum to 1.
# Derived by taking self-transition ~0.995 (less extreme than observed to allow variability)
# and distributing remaining probability according to change-only probabilities (excluding Artifact) re-normalized.
# change-only approximate ratios (from data, excluding Artifact column):
#   Awake: to NREM ~0.9439, REM ~0.00207 -> renorm -> NREM 0.998, REM 0.002
#   NREM: to Awake ~0.7798, REM ~0.2122 -> renorm -> Awake 0.786, REM 0.214
#   REM: to Awake ~0.9356, NREM ~0.0569 -> renorm -> Awake 0.9427, NREM 0.0573
# Remaining (1 - self) = 0.005 distributed by those ratios.
transition_matrix:
  # - [0.972, 0.028, 0.000]      # Awake row
  # - [0.021, 0.969, 0.010]      # NREM row
  # - [0.066, 0.004, 0.930]      # REM row
  - [0.8, 0.1, 0.1]      # Awake row
  - [0.1, 0.8, 0.1]      # NREM row
  - [0.1, 0.1, 0.8]      # REM row

# Fine 1 Hz frequency bins (0–50 Hz) and per-bin mean powers derived from EEG_fine_grained_band_power_1Hz.csv (Mean_Power column, Artifact excluded)
