components_per_epoch: 100        # Slightly richer spectral composition
amplitude_jitter_range: [0.8, 1.2]   # Default jitter; adjust to widen or narrow variability
stage_mean_amplitudes: [0.0, 0.0, 0.0]

# Per-stage magnitude scaling applied after optional normalization (RMS differences)
stage_rms_scales: [1.0, 1.0, 1.0]

# Normalize each epoch to unit std before applying stage_rms_scales
normalize_epoch: true

# Linear boundary smoothing between epochs (seconds). Set 0 to disable.
overlap_s: 0.25
seed: 1234                      # Reproducibility

# Optional stage names mapping for downstream visualization
stage_names: [Awake, NREM, REM]
