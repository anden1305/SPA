name: spectral_wavelength_comparison6
sampling_rate_hz: 128
epoch_length_s: 20
n_epochs: 2000
n_stages: 3

# Balanced transitions to get enough samples of each state
transition_matrix:
  - [0.90, 0.05, 0.05]
  - [0.05, 0.90, 0.05]
  - [0.05, 0.05, 0.90]

frequency_bins:
  - [32.0, 32.0]  # Wavelength = 128/32 = 4 samples  using lag 4
  - [21.3333333, 21.3333333]  # Wavelength = 128/21.333 = 6 samples  using lag 3
  - [16.0, 16.0]  # Wavelength = 128/16 = 8 samples  using lag 2
# maybe use 24 Hz with lag 3

# Each state uses only one specific frequency bin
stage_band_powers:
  - [1.0, 0.0, 0.0]  # State 0: only 64 Hz (wavelength 2)
  - [0.0, 1.0, 0.0]  # State 1: only 32 Hz (wavelength 4)
  - [0.0, 0.0, 1.0]  # State 2: only 16 Hz (wavelength 8)

# Probability of selecting each bin per state
stage_bin_selection_probability:
  - [1.0, 0.0, 0.0]  # State 0: always select 64 Hz
  - [0.0, 1.0, 0.0]  # State 1: always select 32 Hz
  - [0.0, 0.0, 1.0]  # State 2: always select 16 Hz

# Pure single sinusoid per epoch
components_per_epoch: 1

# No amplitude jitter for clean signals
amplitude_jitter_range: [1.0, 1.0, 1.0]

# Identical means across states (no DC offset difference)
stage_mean_amplitudes: [0, 0, 0]

# Smoothing overlap for continuity
overlap_s: 0.01

# Identical RMS scales (unit amplitude)
stage_rms_scales: [1.0, 1.0, 1.0]

# Normalize each epoch to unit variance so instantaneous statistics are identical
normalize_epoch: true

seed: 42

stage_names: [Wave2, Wave4, Wave8]