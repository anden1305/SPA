# MAR dataset with 3 separable states (8Hz, 16Hz, 24Hz)
# Each state has identical instantaneous statistics (mean=0, var=1)
# but distinct temporal/spectral structure via AR coefficients

name: mar_separable_3states
type: mar
sampling_rate_hz: 128
epoch_length_s: 4
n_epochs: 2000
n_stages: 3
stage_names: [State_8Hz, State_16Hz, State_24Hz]

# Balanced transitions between states
transition_matrix:
  - [0.90, 0.05, 0.05]  # State 0 (8Hz)
  - [0.05, 0.90, 0.05]  # State 1 (16Hz)
  - [0.05, 0.05, 0.90]  # State 2 (24Hz)

# AR lags used for coefficient extraction
lags: [1, 2, 4, 8, 16]

# All states have zero mean
stage_mean_amplitudes: [0.0, 0.0, 0.0]

# All states have unit variance (controlled by coefficients + noise_scale)
stage_rms_scales: [1.0, 1.0, 1.0]

# AR coefficients extracted from pure frequency datasets
# All coefficients produce mean=0, variance≈1 with appropriate noise
# Coefficient order matches lags: [1, 2, 4, 8, 16]
stage_coeffs:
  # State 0: 8Hz temporal structure
  - [0.216013, 0.140212, -0.017215, -0.117660, 0.071724]
  # State 1: 16Hz temporal structure
  - [0.140113, -0.007957, -0.163111, 0.120249, 0.087397]
  # State 2: 24Hz temporal structure
  - [0.068759, -0.132122, 0.001723, -0.123527, 0.092363]

# Average noise scale (will be adjusted per-state if needed)
# These were calibrated to produce unit variance
noise_scale: 0.95

# No normalization - coefficients already calibrated
normalize_epoch: false

# Minimal smoothing for clean state transitions
overlap_s: 0.01

seed: 42
