name: mar_test
type: mar
sampling_rate_hz: 128
epoch_length_s: 4
n_epochs: 100
n_stages: 4
stage_names: [Stage1, Stage2, Stage3, Stage4]

transition_matrix:
  - [0.79, 0.07, 0.07, 0.07]
  - [0.07, 0.79, 0.07, 0.07]
  - [0.07, 0.07, 0.79, 0.07]
  - [0.07, 0.07, 0.07, 0.79]

lags: [1, 2, 4, 8, 16, 32, 64] #
stage_mean_amplitudes: [10, 5, 0, -5] # Mean amplitudes for each stage
stage_rms_scales: [1.0, 2.0, 1.5, 0.5] # Scales the visual amplitude of each stage
stage_coeffs:
  # Lags: 1, 2, 4, 8, 16, 32, 64
  - [0.5, -0.2, 0.1, 0.05, 0.02, 0.01, 0.01] # Stage 1
  - [-0.5, 0.1, -0.1, 0.05, -0.02, 0.01, -0.01] # Stage 2
  - [0.8, -0.1, 0.1, 0.1, 0.05, 0.02, 0.01] # Stage 3
  - [0.1, 0.1, 0.05, 0.05, 0.05, 0.05, 0.05] # Stage 4
# Stage 1: Max Root Magnitude = 0.9448 -> Stable
# Stage 2: Max Root Magnitude = 0.9437 -> Stable
# Stage 3: Max Root Magnitude = 0.9951 -> Stable
# Stage 4: Max Root Magnitude = 0.9668 -> Stable
normalize_epoch: True # Import for MAR data because of varying amplitude
overlap_s: 0.25
seed: 1234
