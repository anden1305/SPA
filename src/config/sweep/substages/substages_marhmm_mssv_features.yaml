# Substages experiment: MAR-HMM on MSSV Features
# Sweep over number of states from 2 to 10 to find optimal model complexity
# Purpose: Analyze how loss and NMI change with different state counts

program: main.py
method: grid
metric:
  name: val/log_likelihood
  goal: maximize

parameters:
  # Vary the number of states
  model.n_states:
    values: [2, 3, 4, 5, 6, 7, 8, 9, 10]

# Base configuration
base_config: src/config/run/marhmm/substages/substages_marhmm_mssv_features.yaml
   