trainer:
  epochs: 2
  learning_rate: 0.001
  optimizer: adam
validator:
  accuracy: True
  nmi: True
  cross_nmi: True
  state_distinctness: True
  summary_statistics: True
visualizer:
  losses: True
  pca_tripanel: True
  confusion_matrix: True
  state_distinctness: True
  summary_statistics: True
dataloader:
  batch_size: 16384
  shuffle: True
  normalize: True
  transforms:
    - type: reshape
      params: {}
    - type: fft
      params: {
        "window_size": 512,
        "feature": "power",
      }
dataset:
  type: synthetic
  id: test3
model:
  type: hmm
  init_strategy: kmeans
verbose: true
seed: 123
results_dir: results/training
run_name: test_1
runs: 2
validate_data: true